aid: conviction
name: Conviction
description: Conviction Partners is a venture firm purpose-built to serve AI-native,
  "Software 3.0" companies, founded by Sarah Guo with Mike Vernal as partner. It writes
  $1M to $25M checks, likes to invest early and is often the first investor, backing
  technical teams across AI infrastructure, models, agents, developer tools, security,
  healthcare, legal and robotics, including Baseten, Cognition, Harvey, Mistral, Sierra,
  HeyGen and OpenEvidence. It also runs the Embed grant program, the Commit fellowship,
  the Mixture of Experts recruiting event, and the No Priors and Good Company podcasts.
